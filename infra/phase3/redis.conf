# REVIEW ONLY. Applied only if the user later starts the container.
# 0.0.0.0 is INSIDE the isolated container; host publication is loopback only.
bind 0.0.0.0
port 6379
protected-mode yes
aclfile /run/secrets/redis_acl
daemonize no
logfile ""
loglevel notice
databases 1
dir /data
# Session-only demo: restart invalidates sessions. PostgreSQL stores stock data.
save ""
appendonly no
maxmemory 128mb
maxmemory-policy noeviction
timeout 0
tcp-keepalive 60
