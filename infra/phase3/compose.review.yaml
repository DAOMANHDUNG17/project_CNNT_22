# REVIEW ONLY. No automatic SQL initialization, migrations or fixtures.
name: smart-warehouse-phase3
services:
  redis:
    platform: linux/amd64
    image: ${REDIS_IMAGE:?Set an approved immutable Redis image digest}
    user: redis
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    secrets:
      - redis_acl
      - redis_health_password
    tmpfs:
      - /data:size=134217728,mode=1777
      - /tmp:size=16777216,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_health_password)" redis-cli --user warehouse_health --no-auth-warning ping | grep -qx PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [redis_net]
  postgres-test:
    platform: linux/amd64
    image: ${POSTGRES_IMAGE:?Set an approved immutable PostgreSQL 17 image digest}
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_admin_password]
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres -h 127.0.0.1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks: [postgres_net]
secrets:
  redis_acl:
    file: ${REDIS_ACL_FILE:?Set the local ACL file path}
  redis_health_password:
    file: ${REDIS_HEALTH_PASSWORD_FILE:?Set the local health password file path}
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:?Set the local test PostgreSQL admin password file path}
volumes:
  postgres_test_data:
networks:
  redis_net:
  postgres_net:
